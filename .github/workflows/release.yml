name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version bump to publish
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Plugin
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release configuration
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "Missing required secret: PUBLISH_TOKEN" >&2
            exit 1
          fi

          if [ -z "$PRIVATE_KEY" ]; then
            echo "Missing required secret: PRIVATE_KEY" >&2
            exit 1
          fi

          if [ -z "$PRIVATE_KEY_PASSWORD" ]; then
            echo "Missing required secret: PRIVATE_KEY_PASSWORD" >&2
            exit 1
          fi

          if [ -z "$CERTIFICATE_CHAIN" ]; then
            echo "Missing required secret: CERTIFICATE_CHAIN" >&2
            exit 1
          fi

      - name: Calculate next version
        id: version
        run: |
          current_gradle=$(grep '^version = ' gradle.properties | cut -d '=' -f 2 | xargs)
          current_plugin=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' src/main/resources/META-INF/plugin.xml | head -n 1)

          if [ -z "$current_gradle" ] || [ -z "$current_plugin" ]; then
            echo "Could not read current version from gradle.properties or plugin.xml" >&2
            exit 1
          fi

          if [ "$current_gradle" != "$current_plugin" ]; then
            echo "Version mismatch: gradle.properties=$current_gradle plugin.xml=$current_plugin" >&2
            exit 1
          fi

          if [[ ! "$current_gradle" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Version must be semantic x.y.z, found: $current_gradle" >&2
            exit 1
          fi

          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}

          case "${{ inputs.release_type }}" in
            patch)
              patch=$((patch + 1))
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            *)
              echo "Unsupported release_type: ${{ inputs.release_type }}" >&2
              exit 1
              ;;
          esac

          next_version="$major.$minor.$patch"

          echo "current=$current_gradle" >> "$GITHUB_OUTPUT"
          echo "next=$next_version" >> "$GITHUB_OUTPUT"

      - name: Update version files
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          sed -i "s/^version = .*/version = $NEXT_VERSION/" gradle.properties
          sed -i "0,/<version>.*<\/version>/s//<version>$NEXT_VERSION<\/version>/" src/main/resources/META-INF/plugin.xml

          updated_gradle=$(grep '^version = ' gradle.properties | cut -d '=' -f 2 | xargs)
          updated_plugin=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' src/main/resources/META-INF/plugin.xml | head -n 1)

          if [ "$updated_gradle" != "$NEXT_VERSION" ] || [ "$updated_plugin" != "$NEXT_VERSION" ]; then
            echo "Version update failed" >&2
            exit 1
          fi

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Run tests
        run: ./gradlew check

      - name: Verify plugin
        run: ./gradlew verifyPlugin

      - name: Sign and validate plugin archive
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: |
          ./gradlew signPlugin
          for archive in ./build/distributions/*.zip; do
            unzip -tq "$archive"
          done

      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: ./gradlew publishPlugin

      - name: Commit and push release version
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties src/main/resources/META-INF/plugin.xml
          git commit -m "Release $NEXT_VERSION"
          git tag "v$NEXT_VERSION"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v$NEXT_VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          gh release create "v$NEXT_VERSION" ./build/distributions/* \
            --title "v$NEXT_VERSION" \
            --generate-notes
