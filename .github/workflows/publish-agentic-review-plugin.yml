name: Publish Agentic Review Plugin

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version bump to publish
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-agentic-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Calculate next version
        id: version
        working-directory: packages/agentic-review
        run: |
          current=$(node -p "require('./package.json').version")

          if [[ ! "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Version must be semantic x.y.z, found: $current" >&2
            exit 1
          fi

          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}

          case "${{ inputs.release_type }}" in
            patch)
              patch=$((patch + 1))
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            *)
              echo "Unsupported release_type: ${{ inputs.release_type }}" >&2
              exit 1
              ;;
          esac

          next_version="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next_version" >> "$GITHUB_OUTPUT"

      - name: Update version
        working-directory: packages/agentic-review
        run: |
          node -e "const p=require('./package.json'); p.version='${{ steps.version.outputs.next }}'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2)+'\n')"

      - name: Verify version update
        working-directory: packages/agentic-review
        run: |
          updated=$(node -p "require('./package.json').version")
          if [ "$updated" != "${{ steps.version.outputs.next }}" ]; then
            echo "Version update failed: expected ${{ steps.version.outputs.next }}, got $updated" >&2
            exit 1
          fi

      - name: Install dependencies
        working-directory: packages/agentic-review
        run: npm ci

      - name: Build
        working-directory: packages/agentic-review
        run: npm run build

      - name: Publish to npm
        working-directory: packages/agentic-review
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --provenance

      - name: Commit and push release version
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/agentic-review/package.json packages/agentic-review/package-lock.json
          git commit -m "Release agentic-review v$NEXT_VERSION"
          git tag "agentic-review-v$NEXT_VERSION"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "agentic-review-v$NEXT_VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          gh release create "agentic-review-v$NEXT_VERSION" \
            --title "agentic-review v$NEXT_VERSION" \
            --generate-notes
